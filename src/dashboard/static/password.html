<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · browserctl</title>
  <link rel="stylesheet" href="/dashboard/static/style.css">
  <script type="module" src="/dashboard/static/password.js"></script>
</head>
<body>
  <main class="sign-in">
    <h1>browserctl</h1>
    <form id="password-sign-in" action="/dashboard/login" method="post">
      <label for="password">Development password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p id="sign-in-error" role="alert"></p>
    </form>
  </main>
</body>
</html>
